name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  gates:
    name: Security and validation gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Run all gates (require analyzer)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\Run-AllGates.ps1 -RequireAnalyzer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Certification (self-attestation artifact)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File certification\New-Certification.ps1 -RequireAnalyzer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload certification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification
          path: |
            certification/last_certification.json
            certification/last_certification.txt
          if-no-files-found: ignore
